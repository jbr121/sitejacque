<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceita sair comigo?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💓</span>
    <span>💗</span>
    <span>💞</span>
    <span>💕</span>
    <span>💖</span>
  </div>

  <main class="card">
    <p class="sparkles">💕 💖 💗 💓</p>
    <img class="foto" src="foto.png" alt="Eu, esperando a sua resposta">
    <h1>Aceita sair comigo? 💕</h1>
    <p class="sub">Prometo que vai ser fofo. 💖</p>
    <div class="botoes">
      <button type="button" id="sim" class="btn sim">Sim</button>
      <button type="button" id="nao" class="btn nao">Não</button>
    </div>
  </main>

  <div class="celebracao" id="celebracao" hidden>
    <div class="chuva" id="chuva" aria-hidden="true"></div>
    <div class="mensagem">
      <p class="grande">Sabia que você ia dizer sim 💖</p>
      <p>Mal posso esperar. 💗 💞</p>

      <section class="agenda" aria-labelledby="titulo-agenda">
        <h2 id="titulo-agenda">Nossa agenda</h2>
        <p class="escolhe">Escolhe o dia:</p>
        <div class="calendario" id="calendario"></div>
        <p class="escolha" id="escolha" hidden></p>
        <p class="aviso" id="aviso" hidden></p>
        <iframe class="aviso-frame" name="aviso-frame" id="aviso-frame" hidden title="Envio da data"></iframe>
        <form id="aviso-form" action="https://formsubmit.co/joseedua2sam@gmail.com" method="POST" target="aviso-frame" hidden>
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_subject" id="aviso-assunto" value="">
          <input type="hidden" name="mensagem" id="aviso-mensagem" value="">
        </form>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
