<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceita sair comigo?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💓</span>
    <span>💗</span>
    <span>💞</span>
    <span>💕</span>
    <span>💖</span>
  </div>

  <main class="card">
    <p class="sparkles">💕 💖 💗 💓</p>
    <div class="moldura">
      <svg class="seta seta-esquerda" viewBox="0 0 86 48" aria-hidden="true">
        <path d="M6 34 C 24 36, 46 20, 68 18" />
        <path d="M54 8 L72 18 L54 30" />
      </svg>
      <svg class="seta seta-direita" viewBox="0 0 86 48" aria-hidden="true">
        <path d="M80 34 C 62 36, 40 20, 18 18" />
        <path d="M32 8 L14 18 L32 30" />
      </svg>
      <svg class="seta seta-cima" viewBox="0 0 48 72" aria-hidden="true">
        <path d="M14 6 C 12 24, 28 40, 26 58" />
        <path d="M14 46 L26 62 L36 44" />
      </svg>
      <img class="foto" src="foto.png" alt="Eu, esperando a sua resposta">
    </div>
    <h1>Aceita sair comigo? 💕</h1>
    <p class="sub">Prometo que vai ser fofo. 💖</p>
    <div class="botoes">
      <button type="button" id="sim" class="btn sim">Sim</button>
      <button type="button" id="nao" class="btn nao">Não</button>
    </div>
  </main>

  <div class="celebracao" id="celebracao" hidden>
    <div class="chuva" id="chuva" aria-hidden="true"></div>
    <div class="mensagem">
      <p class="grande">Sabia que você ia dizer sim 💖</p>
      <p>Mal posso esperar. 💗 💞</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
